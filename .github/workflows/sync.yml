name: Sync upstream skills
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
concurrency:
  group: sync-upstream
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  SYNC_BRANCH: sync/upstream
jobs:
  sync:
    name: Sync
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open the pull request and enable auto-merge
      actions: write # dispatch CI for the sync branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild from the current upstream branches
        run: python3 scripts/skills.py update --summary "${RUNNER_TEMP}/summary.md"
      - name: Validate the rebuilt mirror
        run: python3 scripts/skills.py check
      - name: Open or refresh the sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Upstream unchanged."
            exit 0
          fi
          {
            echo "Automated sync of the mirrored upstream skills."
            echo
            cat "${RUNNER_TEMP}/summary.md"
            echo
            echo "Merges automatically once \`CI Check\` passes."
          } > "${RUNNER_TEMP}/body.md"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${SYNC_BRANCH}"
          git add --all
          git commit --quiet --message "chore: sync upstream skills"
          git push --force origin "${SYNC_BRANCH}"
          pr="$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
          if [[ -n "${pr}" ]]; then
            gh pr edit "${pr}" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create --head "${SYNC_BRANCH}" --base main \
              --title "chore: sync upstream skills" --body-file "${RUNNER_TEMP}/body.md"
          fi
          gh pr merge "${SYNC_BRANCH}" --auto --squash
          gh workflow run ci.yml --ref "${SYNC_BRANCH}"
